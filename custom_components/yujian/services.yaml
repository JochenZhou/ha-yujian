notify:
  name: 玉简横幅通知
  description: >-
    在电视顶部推送一条横幅通知，可附一张图片或一路 MJPEG 视频流。电视端服务被系统杀掉时，会自动通过 ADB 拉起后重试。
  fields:
    message:
      name: 正文
      description: 横幅正文，最多四行。正文、图片、视频全空时电视端会拒绝。
      required: true
      example: 晾晒提醒：衣服可以收了
      selector:
        text:
    title:
      name: 标题
      description: 横幅标题，可留空。
      example: 洗衣机已完成
      selector:
        text:
    duration:
      name: 停留秒数
      description: 横幅在屏幕上停留的秒数，1–30，默认 5。
      example: 8
      default: 5
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: 秒
    level:
      name: 分级
      description: 决定铃铛与描边的颜色。
      example: warn
      default: info
      selector:
        select:
          options:
            - label: 普通（白）
              value: info
            - label: 警告（琥珀）
              value: warn
            - label: 错误（红）
              value: error
    sticky:
      name: 常驻
      description: 勾选后横幅不自动消失，直到被新通知替换、调用 yujian.dismiss 或到 max_duration 上限。
      default: false
      selector:
        boolean:
    max_duration:
      name: 常驻上限秒数
      description: 常驻横幅的兜底消失时间，30–3600 秒，默认 300 秒。防止推送方异常后横幅永久占屏。
      example: 300
      default: 300
      selector:
        number:
          min: 30
          max: 3600
          step: 30
          unit_of_measurement: 秒
    sound:
      name: 播放提示音
      description: 横幅入场时是否播放提示音。
      default: true
      selector:
        boolean:
    image:
      name: 图片
      description: 图片地址（http(s) URL）或 base64 内联图片；摄像头截图可以接到 camera.snapshot 的输出。
      example: https://example.com/doorbell.jpg
      selector:
        text:
    video:
      name: 视频（MJPEG 流）
      description: MJPEG 流地址（multipart/x-mixed-replace），例如摄像头的 MJPEG 子码流；App 以约 15 帧/秒软解显示。不支持 mp4 等普通视频文件。
      example: http://192.168.101.20:8080/stream
      selector:
        text:
    position:
      name: 显示位置
      description: 覆盖电视端的默认方位。留空表示沿用电视上的默认设置（顶边通栏）。四角为画中画小窗样式。
      example: bottom-right
      selector:
        select:
          options:
            - label: 顶边通栏（默认）
              value: top
            - label: 底边通栏
              value: bottom
            - label: 左上角小窗
              value: top-left
            - label: 右上角小窗
              value: top-right
            - label: 左下角小窗
              value: bottom-left
            - label: 右下角小窗
              value: bottom-right
    tts:
      name: 语音播报
      description: 打开则朗读标题与正文；也可以填一段自定义文本，只读这段（正文照常显示）。
      example: 门口有人，请查看
      selector:
        text:
    queue:
      name: 排队展示
      description: 勾选后，如果当前已有横幅在展示，这条会排在后面依次播放，而不是抢先顶掉它。
      default: false
      selector:
        boolean:
    notify_id:
      name: 通知标识
      description: 同一条标识再次推送时，会在原横幅上平滑更新文案与倒计时（不会重新入场闪烁）。适合倒计时、进度这类高频刷新。
      example: washer-progress
      selector:
        text:
    image_interval:
      name: 图片刷新秒数
      description: 仅对图片生效。设置后电视会按该间隔重新拉取图片地址，把静态快照变成准视频流（1–10 秒）。
      example: 2
      selector:
        number:
          min: 1
          max: 10
          step: 1
          unit_of_measurement: 秒
dismiss:
  name: 玉简关闭横幅
  description: >-
    立即关闭当前显示的横幅。接口是幂等的：没有横幅在显示时调用也返回成功。
set_config:
  name: 玉简电视设置
  description: >-
    调整电视端的「闭关免扰」（静音，不再弹横幅）与默认显示位置。两项都可只改其一，改完立即回读电视真实状态。
  fields:
    muted:
      name: 闭关免扰
      description: 打开后电视不再显示横幅（相当于静音开关）。
      default: false
      selector:
        boolean:
    position:
      name: 默认显示位置
      description: 电视端新横幅的默认方位，影响不指定 position 的推送。
      example: top
      selector:
        select:
          options:
            - label: 顶边通栏
              value: top
            - label: 底边通栏
              value: bottom
            - label: 左上角小窗
              value: top-left
            - label: 右上角小窗
              value: top-right
            - label: 左下角小窗
              value: bottom-left
            - label: 右下角小窗
              value: bottom-right
