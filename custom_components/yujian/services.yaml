notify:
  name: 玉简横幅通知
  description: 向选定设备发送横幅通知，可附图片或 MJPEG 流；未选目标时发送到所有已配置的玉简设备。
  target:
    entity:
      domain: notify
      integration: yujian
  fields:
    message:
      name: 正文
      description: 可选正文，最多四行；标题、正文、图片或视频至少填写一项。
      required: false
      example: 晾晒提醒：衣服可以收了
      selector:
        text:
          multiline: true
    title:
      name: 标题
      description: 横幅标题，可留空。
      example: 洗衣机已完成
      selector:
        text: null
    duration:
      name: 停留秒数
      description: 横幅停留时间，1–30 秒；留空使用集成选项中的默认时长。
      example: 8
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: 秒
    level:
      name: 分级
      description: 决定铃铛与描边的颜色。
      example: warn
      default: info
      selector:
        select:
          translation_key: level
          options:
          - info
          - warn
          - error
    sticky:
      name: 常驻
      description: 勾选后横幅不自动消失，直到被新通知替换、调用 yujian.dismiss 或到 max_duration 上限。
      default: false
      selector:
        boolean: null
    max_duration:
      name: 常驻上限秒数
      description: 常驻横幅的兜底消失时间，30–3600 秒，默认 300 秒。防止推送方异常后横幅永久占屏。
      example: 300
      default: 300
      selector:
        number:
          min: 30
          max: 3600
          step: 30
          unit_of_measurement: 秒
    sound:
      name: 播放提示音
      description: 是否播放入场提示音；设备静音开启时不播放，横幅仍然显示。
      default: true
      selector:
        boolean: null
    image:
      name: 图片
      description: 图片的 HTTP(S) 地址或 base64 内容；电视需能直接访问图片地址。
      example: https://example.com/doorbell.jpg
      selector:
        text: null
    video:
      name: 视频（MJPEG 流）
      description: MJPEG 流地址（multipart/x-mixed-replace），例如摄像头的 MJPEG 子码流；App 以约 15 帧/秒软解显示。不支持 mp4 等普通视频文件。
      example: http://192.168.101.20:8080/stream
      selector:
        text: null
    position:
      name: 显示位置
      description: 仅覆盖本次通知的位置；留空沿用设备默认设置，四角使用小窗样式。
      example: bottom-right
      selector:
        select:
          translation_key: position
          options:
          - top
          - bottom
          - top-left
          - top-right
          - bottom-left
          - bottom-right
    speak:
      name: 语音播报
      description: off 不播报；ha 使用集成选项中的 TTS 服务；tv 使用电视语音引擎。兼容 true（ha）和 false（off）。设备静音时不播放语音。
      default: 'off'
      selector:
        select:
          translation_key: speak
          options:
          - 'off'
          - ha
          - tv
    queue:
      name: 排队展示
      description: 勾选后，如果当前已有横幅在展示，这条会排在后面依次播放，而不是抢先顶掉它。
      default: false
      selector:
        boolean: null
    notify_id:
      name: 通知标识
      description: 同一条标识再次推送时，会在原横幅上平滑更新文案与倒计时（不会重新入场闪烁）。适合倒计时、进度这类高频刷新。
      example: washer-progress
      selector:
        text: null
    image_interval:
      name: 图片刷新秒数
      description: 仅对图片生效。设置后电视会按该间隔重新拉取图片地址，把静态快照变成准视频流（1–10 秒）。
      example: 2
      selector:
        number:
          min: 1
          max: 10
          step: 1
          unit_of_measurement: 秒
    theme:
      name: 本次通知主题
      description: 仅覆盖本次通知的主题；留空沿用设备默认主题，不修改全局设置。
      example: cyberpunk
      selector:
        select:
          translation_key: theme
          options:
          - xiuxian
          - default
          - palace
          - cyberpunk
          - wukong
          - matrix
          - ink_light
          - gamer
          - minecraft
dismiss:
  name: 玉简关闭横幅
  description: 立即关闭当前显示的横幅。接口是幂等的：没有横幅在显示时调用也返回成功。
  target:
    entity:
      domain: notify
      integration: yujian
set_config:
  name: 玉简电视设置
  description: 修改通知静音、默认位置或默认主题；只传需要修改的字段。静音关闭提示音和语音，横幅仍然显示。
  target:
    entity:
      domain: notify
      integration: yujian
  fields:
    muted:
      name: 通知静音
      description: 开启后关闭提示音与语音播报，横幅仍然显示。
      selector:
        boolean: null
    theme:
      name: 界面主题
      description: 设备默认主题，影响未指定 theme 的后续通知。
      example: xiuxian
      selector:
        select:
          translation_key: theme
          options:
          - xiuxian
          - default
          - palace
          - cyberpunk
          - wukong
          - matrix
          - ink_light
          - gamer
          - minecraft
    position:
      name: 默认显示位置
      description: 电视端新横幅的默认方位，影响不指定 position 的推送。
      example: top
      selector:
        select:
          translation_key: position
          options:
          - top
          - bottom
          - top-left
          - top-right
          - bottom-left
          - bottom-right
